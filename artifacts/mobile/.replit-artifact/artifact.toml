kind = "mobile"
previewPath = "/mobile/"
title = "Qiyam Mobile"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "bun run --cwd artifacts/mobile dev"

[services.production]
build = [ "bun", "run", "--cwd", "artifacts/mobile", "build" ]
run = [ "bun", "run", "--cwd", "artifacts/mobile", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
